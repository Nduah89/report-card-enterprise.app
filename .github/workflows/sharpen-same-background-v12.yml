name: Restore and sharpen selected Edusentia academic background v12

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sharpen-same-background-v12.yml"

permissions:
  contents: write

jobs:
  restore-and-sharpen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover the same selected academic artwork from accepted Git history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 82d236df2470bc2952114631b36a1ef552508769^{commit}
          git show 82d236df2470bc2952114631b36a1ef552508769:assets/edusentia-login-background-final.webp > /tmp/source.webp
          test "$(git hash-object /tmp/source.webp)" = "6f0fa56f3a00e9a4e82d2a7f40591c0c5254e9db"
          test "$(stat -c%s /tmp/source.webp)" = "10712"
          test "$(head -c 4 /tmp/source.webp)" = "RIFF"
          test "$(dd if=/tmp/source.webp bs=1 skip=8 count=4 status=none)" = "WEBP"

      - name: Produce a high-clarity version without changing the artwork
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IMG=magick
          elif command -v convert >/dev/null 2>&1; then
            IMG=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMG=convert
          fi
          src_dim="$($IMG identify -format '%wx%h' /tmp/source.webp 2>/dev/null || identify -format '%wx%h' /tmp/source.webp)"
          if [ "$IMG" = "magick" ]; then
            magick /tmp/source.webp -colorspace sRGB -filter Lanczos -resize 200% -unsharp 0x1.15+1.05+0.015 -resize 50% -quality 92 -define webp:method=6 /tmp/final.webp
            out_dim="$(magick identify -format '%wx%h' /tmp/final.webp)"
          else
            convert /tmp/source.webp -colorspace sRGB -filter Lanczos -resize 200% -unsharp 0x1.15+1.05+0.015 -resize 50% -quality 92 -define webp:method=6 /tmp/final.webp
            out_dim="$(identify -format '%wx%h' /tmp/final.webp)"
          fi
          test "$src_dim" = "$out_dim"
          size="$(stat -c%s /tmp/final.webp)"
          test "$size" -ge 30000
          test "$size" -le 500000
          test "$(head -c 4 /tmp/final.webp)" = "RIFF"
          test "$(dd if=/tmp/final.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          echo "source_dimensions=$src_dim"
          echo "final_bytes=$size"
          echo "final_git_blob=$(git hash-object /tmp/final.webp)"
          sha256sum /tmp/final.webp

      - name: Install clarified artwork and invalidate every old visual cache
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/final.webp assets/edusentia-login-background-final.webp
          sed -i 's/r37-final-ui-11-asset-repair/r37-final-ui-12-same-background-sharpened/g' index.html service-worker.js
          grep -q 'r37-final-ui-12-same-background-sharpened' index.html
          grep -q 'r37-final-ui-12-same-background-sharpened' service-worker.js
          rm -rf .asset-staging/exact-academic-bg .asset-staging/exact-academic-bg-v3 .asset-staging/exact-academic-bg-v2
          rm -f .github/workflows/assemble-exact-academic-background-v12.yml
          rm -f .github/workflows/sharpen-same-background-v12.yml

      - name: Commit the verified production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore same academic background at production clarity"
          git push
