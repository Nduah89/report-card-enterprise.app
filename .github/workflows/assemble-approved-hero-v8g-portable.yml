name: Assemble approved r37 hero v8g portable

on:
  push:
    branches:
      - fix/r37-approved-login-hero-v8g
    paths:
      - ".github/workflows/assemble-approved-hero-v8g-portable.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify exact approved hero
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/edusentia-login-hero-r37.webp
          for sha in \
            756302cb2aa5d3fcf526071bb06af25808896c84 \
            8162d35d8496364fd0bd78d8fabb38028a59f3e5 \
            ab76eb4d4ca171698eae44e9b771d0a7bb7a3727 \
            b1d96fc164feb9e117aaa6da2975b43d47de1313 \
            a0c98ac331813e101294b883c381ebe1ca6fbbcd \
            980d9f3ca98604c308631869f6f6d3d5379acfb8 \
            dd6efce4603a8383f75234e102a56b01ca06549a \
            bf9b1b5a1828523918cb0a4421455daf42e217bc \
            2d89dd18c87ce9fd25f7b9f5dc6689f61fd7719c \
            2b25c780617cd6f5312c2920d899ac0a7e8cb1c0 \
            2c55af1a27658274ed935b334627ecdbafeba6a8 \
            16b77c948d398345490916d0e75f10f84a1da6f0 \
            da158fcbe661a54e752a42070dbc8831cf7ad25d
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' | tr -d '\n' | base64 --decode >> /tmp/edusentia-login-hero-r37.webp
          done
          echo "7389a2e438aa7c975c691817b5cbfd5f61280da19c83c37d076334586b093b50  /tmp/edusentia-login-hero-r37.webp" | sha256sum -c -
          test "$(stat -c%s /tmp/edusentia-login-hero-r37.webp)" = "74634"
          cp /tmp/edusentia-login-hero-r37.webp assets/edusentia-login-hero-r37.webp
      - name: Commit verified hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/edusentia-login-hero-r37.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assemble approved full-HD r37 login hero v8"
          git push
