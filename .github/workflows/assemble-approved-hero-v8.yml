name: Assemble approved r37 hero v8

on:
  push:
    branches:
      - fix/r37-approved-login-hero-v8
    paths:
      - ".hero_parts/**"
      - ".github/workflows/assemble-approved-hero-v8.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose staged parts
        shell: bash
        run: |
          set -euo pipefail
          for f in .hero_parts/part*.b64; do
            wc -c "$f"
            sha256sum "$f"
          done
          cat .hero_parts/part*.b64 | base64 --decode > /tmp/edusentia-login-hero-r37.webp
          echo "decoded-size=$(stat -c%s /tmp/edusentia-login-hero-r37.webp)"
          sha256sum /tmp/edusentia-login-hero-r37.webp

      - name: Assemble and verify approved hero
        shell: bash
        run: |
          set -euo pipefail
          echo "532fe7ffdc4e1bcef243b095f3cf14fd19e2b50323e681596161135e86e98470  /tmp/edusentia-login-hero-r37.webp" | sha256sum -c -
          test "$(stat -c%s /tmp/edusentia-login-hero-r37.webp)" = "122540"
          cp /tmp/edusentia-login-hero-r37.webp assets/edusentia-login-hero-r37.webp

      - name: Commit verified binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/edusentia-login-hero-r37.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Assemble approved high-resolution r37 login hero v8"
          git push
