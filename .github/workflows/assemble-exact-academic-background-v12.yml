name: Assemble exact Edusentia academic background v12

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/assemble-exact-academic-background-v12.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact approved artwork
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/exact-academic-bg/part*.b64 > /tmp/edusentia-background.b64
          base64 -d /tmp/edusentia-background.b64 > /tmp/edusentia-background.webp
          echo "ad5123c06dfaa49ab11f33d80bda237dff5a6e4717056113c97bd3972cb01e2f  /tmp/edusentia-background.webp" | sha256sum -c -
          test "$(stat -c%s /tmp/edusentia-background.webp)" = "95488"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/edusentia-background.webp')
          b = p.read_bytes()
          assert len(b) == 95488, len(b)
          assert b[:4] == b'RIFF', b[:4]
          assert b[8:12] == b'WEBP', b[8:12]
          print('Verified WebP container, bytes=', len(b))
          PY

      - name: Install exact artwork and advance cache generation
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/edusentia-background.webp assets/edusentia-login-background-final.webp
          sed -i 's/r37-final-ui-11-asset-repair/r37-final-ui-12-exact-artwork/g' index.html service-worker.js
          grep -q 'r37-final-ui-12-exact-artwork' index.html
          grep -q 'r37-final-ui-12-exact-artwork' service-worker.js
          rm -rf .asset-staging/exact-academic-bg
          rm -f .github/workflows/assemble-exact-academic-background-v12.yml

      - name: Commit verified production-ready asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install exact Edusentia academic login background"
          git push
