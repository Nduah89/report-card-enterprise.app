name: Install approved Edusentia login backgrounds v16

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-approved-login-backgrounds-v16.yml"

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify both approved backgrounds
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/approved-bg2/part*.b64 > /tmp/bg2.b64
          cat .asset-staging/approved-bg3/part*.b64 > /tmp/bg3.b64
          base64 -d /tmp/bg2.b64 > /tmp/bg2.webp
          base64 -d /tmp/bg3.b64 > /tmp/bg3.webp

          echo "6cff7efde477c3855651254a4ae80bce5e0fca183be3ca601744719ad1a8dc95  /tmp/bg2.webp" | sha256sum -c -
          echo "10d58fdc464ceba48302f5c7880b0603d5656cab428d3ea145303c83bb572176  /tmp/bg3.webp" | sha256sum -c -
          test "$(stat -c%s /tmp/bg2.webp)" = "43748"
          test "$(stat -c%s /tmp/bg3.webp)" = "42794"

          python3 - <<'PY'
          from pathlib import Path
          import struct

          def dimensions(path):
              b = Path(path).read_bytes()
              assert b[:4] == b"RIFF", (path, b[:4])
              assert b[8:12] == b"WEBP", (path, b[8:12])
              pos = 12
              while pos + 8 <= len(b):
                  kind = b[pos:pos+4]
                  size = struct.unpack_from("<I", b, pos+4)[0]
                  data = b[pos+8:pos+8+size]
                  if kind == b"VP8 ":
                      assert data[3:6] == b"\x9d\x01\x2a", (path, kind)
                      w = struct.unpack_from("<H", data, 6)[0] & 0x3fff
                      h = struct.unpack_from("<H", data, 8)[0] & 0x3fff
                      return w, h
                  if kind == b"VP8X":
                      w = 1 + int.from_bytes(data[4:7], "little")
                      h = 1 + int.from_bytes(data[7:10], "little")
                      return w, h
                  pos += 8 + size + (size & 1)
              raise AssertionError(f"Unsupported WebP layout: {path}")

          assert dimensions("/tmp/bg2.webp") == (1672, 941), dimensions("/tmp/bg2.webp")
          assert dimensions("/tmp/bg3.webp") == (1672, 941), dimensions("/tmp/bg3.webp")
          print("Verified approved backgrounds at 1672x941")
          PY

      - name: Install Master background and retain verified Nipe source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/bg2.webp assets/approved-login-background-2.webp
          cp /tmp/bg3.webp assets/approved-login-background-3.webp
          cp /tmp/bg2.webp assets/edusentia-login-background-final.webp

          sed -i 's/r37-final-ui-11-asset-repair/r37-final-ui-16-approved-bg2/g' index.html service-worker.js
          grep -q 'r37-final-ui-16-approved-bg2' index.html
          grep -q 'r37-final-ui-16-approved-bg2' service-worker.js

          rm -rf .asset-staging/approved-bg2 .asset-staging/approved-bg3
          rm -rf .asset-staging/exact-academic-bg .asset-staging/exact-academic-bg-v2 .asset-staging/exact-academic-bg-v3
          rm -f .github/workflows/assemble-exact-academic-background-v12.yml
          rm -f .github/workflows/sharpen-same-background-v12.yml
          rm -f .github/workflows/finalize-same-academic-background-v13.yml
          rm -f .github/workflows/finalize-same-academic-background-v14.yml
          rm -f .github/workflows/install-approved-login-backgrounds-v16.yml

      - name: Commit verified Master visual release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install approved Master login background"
          git push
