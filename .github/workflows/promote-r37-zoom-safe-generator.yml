name: Promote r37 zoom-safe generator overlay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-r37-zoom-safe-generator.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ezerkcduxgjvaugxsfel
      OLD_UI_RELEASE: r37-final-ui2
      OLD_UI_SHA: d03d4e63836b5e206294a246dec6328f86cd594b742af567a67aad480de2b238
      NEW_UI_RELEASE: r37-final-ui3-zoom-safe
      NEW_UI_SHA: 607bb0586d86cef19cb3f07e96ea018cfa7fb70bcdba82783bf3f9c1953a0389
      EXPECTED_BODY_SHA: baa0ebaff56890e82b5142ed27fadd273efe49dcbecabee82789dd3dbe744d93
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require existing Supabase CI credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN secret is not configured"; exit 20; }
      - name: Download exact live platform-package-manager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/live-function"
          mkdir -p "$RUNNER_TEMP/live-function"
          cd "$RUNNER_TEMP/live-function"
          supabase functions download platform-package-manager --project-ref "$SUPABASE_PROJECT_ID"
          test -s supabase/functions/platform-package-manager/index.ts
          cp supabase/functions/platform-package-manager/index.ts "$GITHUB_WORKSPACE/platform-package-manager.v43.downloaded.ts"
      - name: Verify original body and build fail-closed overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip, hashlib, os
          p=Path('platform-package-manager.v43.downloaded.ts')
          s=p.read_text()
          expected=os.environ['EXPECTED_BODY_SHA']
          m=re.search(r'const BODY_SHA256\s*=\s*"([a-f0-9]{64})"',s)
          if not m or m.group(1)!=expected:
              raise SystemExit(f'Unexpected wrapper BODY_SHA256: {m.group(1) if m else "missing"}')
          b=re.search(r'const BODY_GZ_B64\s*=\s*(.*?);\s*\n\s*const packed',s,re.S)
          if not b: raise SystemExit('BODY_GZ_B64 block not found')
          chunks=re.findall(r'"([A-Za-z0-9+/=]+)"',b.group(1))
          if not chunks: raise SystemExit('BODY_GZ_B64 chunks not found')
          body=gzip.decompress(base64.b64decode(''.join(chunks))).decode()
          digest=hashlib.sha256(body.encode()).hexdigest()
          if digest!=expected: raise SystemExit(f'Decompressed live body hash mismatch: {digest}')
          old_rel=os.environ['OLD_UI_RELEASE']; old_sha=os.environ['OLD_UI_SHA']
          rel_count=body.count(old_rel); sha_count=body.count(old_sha)
          print(f'live_body_sha={digest} old_release_count={rel_count} old_sha_count={sha_count}')
          if rel_count < 1 or sha_count < 1 or rel_count > 6 or sha_count > 6:
              raise SystemExit('Unexpected zoom-bundle reference counts; refusing deployment')
          old='await eval(`(async()=>{\\n${body}\\n})()`);'
          if s.count(old)!=1: raise SystemExit('Expected eval handoff not found exactly once')
          new=f'''const ZOOM_SAFE_OLD_RELEASE = "{old_rel}";\nconst ZOOM_SAFE_NEW_RELEASE = "{os.environ['NEW_UI_RELEASE']}";\nconst ZOOM_SAFE_OLD_SHA = "{old_sha}";\nconst ZOOM_SAFE_NEW_SHA = "{os.environ['NEW_UI_SHA']}";\nconst zoomSafeReleaseCount = body.split(ZOOM_SAFE_OLD_RELEASE).length - 1;\nconst zoomSafeShaCount = body.split(ZOOM_SAFE_OLD_SHA).length - 1;\nif (zoomSafeReleaseCount !== {rel_count} || zoomSafeShaCount !== {sha_count}) throw new Error(`Edusentia r37 zoom-safe generator overlay precondition failure: release=${{zoomSafeReleaseCount}}/{rel_count}, sha=${{zoomSafeShaCount}}/{sha_count}`);\nconst zoomSafeBody = body.split(ZOOM_SAFE_OLD_RELEASE).join(ZOOM_SAFE_NEW_RELEASE).split(ZOOM_SAFE_OLD_SHA).join(ZOOM_SAFE_NEW_SHA);\nif (zoomSafeBody.includes(ZOOM_SAFE_OLD_RELEASE) || zoomSafeBody.includes(ZOOM_SAFE_OLD_SHA)) throw new Error("Edusentia r37 zoom-safe generator overlay left an old UI binding");\nawait eval(`(async()=>{{\\n${{zoomSafeBody}}\\n}})()`);'''
          patched=s.replace(old,new)
          p.write_text(patched)
          Path('platform-package-manager.overlay-proof.txt').write_text(f'original_body_sha256={digest}\nold_release_count={rel_count}\nold_sha_count={sha_count}\nnew_release={os.environ["NEW_UI_RELEASE"]}\nnew_sha={os.environ["NEW_UI_SHA"]}\n')
          PY
      - name: Put patched source in isolated function folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/deploy"
          mkdir -p "$RUNNER_TEMP/deploy/supabase/functions/platform-package-manager"
          cp platform-package-manager.v43.downloaded.ts "$RUNNER_TEMP/deploy/supabase/functions/platform-package-manager/index.ts"
      - name: Deploy only platform-package-manager with API bundling
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/deploy"
          supabase functions deploy platform-package-manager --project-ref "$SUPABASE_PROJECT_ID" --use-api
